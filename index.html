<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trading Journal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header>
    <h1>Trading journal</h1>
    <p class="subtitle">EUR/USD, USD/JPY, USD/CHF, AUD/USD — pullback strategy, 1:2/1:3 risk-reward, 100 KES risk per trade.</p>
  </header>

  <section id="stats" class="stats-grid"></section>

  <section class="card">
    <h2>Log a new trade</h2>
    <form id="trade-form">
      <div class="grid-2">
        <div class="field">
          <label for="f-pair">Pair</label>
          <select id="f-pair">
            <option>EUR/USD</option>
            <option>USD/JPY</option>
            <option>USD/CHF</option>
            <option>AUD/USD</option>
            <option>GBP/USD</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="f-dir">Direction</label>
          <select id="f-dir">
            <option>Buy</option>
            <option>Sell</option>
          </select>
        </div>
      </div>
      <div class="grid-3">
        <div class="field">
          <label for="f-entry">Entry price</label>
          <input type="text" id="f-entry" placeholder="1.1655" />
        </div>
        <div class="field">
          <label for="f-stop">Stop price</label>
          <input type="text" id="f-stop" placeholder="1.1635" />
        </div>
        <div class="field">
          <label for="f-target">Target price</label>
          <input type="text" id="f-target" placeholder="1.1695" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="f-risk">KES risked</label>
          <input type="text" id="f-risk" placeholder="100" />
        </div>
        <div class="field">
          <label for="f-outcome">Outcome</label>
          <select id="f-outcome">
            <option value="open">Open / pending</option>
            <option value="win">Win</option>
            <option value="loss">Loss</option>
            <option value="breakeven">Breakeven</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-checklist">All 6 checklist criteria met?</label>
        <select id="f-checklist">
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="field">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" placeholder="What you saw, why you entered..."></textarea>
      </div>
      <div id="f-error" class="error"></div>
      <button type="submit" id="f-submit">Add trade</button>
    </form>
  </section>

  <section>
    <h2>Trade history</h2>
    <div id="history"></div>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
